```html
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">Electronics Workshop</p>
            <h1>Student Project Tracker</h1>
            <p class="intro">Keep your next engineering idea moving.</p>
        </header>

        <section class="card">
            <h2 id="form-title">Add a project</h2>

            <form id="project-form">
                <label for="name">Project name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Example: IoT Monitor"
                    required
                    maxlength="80"
                >

                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Planned">Planned</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>

                <div class="actions">
                    <button type="submit" id="save-button">
                        Add project
                    </button>
                    <button type="button" id="cancel-button" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <p id="message" role="status" aria-live="polite">Ready.</p>

        <section class="card">
            <h2 id="list-title">My projects</h2>
            <p id="empty-state">No projects yet. Add your first idea.</p>
            <ul id="project-list"></ul>
        </section>
    </main>
</body>
</html
